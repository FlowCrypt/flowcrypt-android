version: v1.0
name: FlowCrypt Android App
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
execution_time_limit:
  minutes: 75

fail_fast:
  stop:
    when: "branch != 'master'" # Stopping all jobs on the first failure

auto_cancel:
  running:
    when: "branch != 'master'" # Auto-cancel all pipelines on a new push to a non-master branch

global_job_config:
  env_vars:
    - name: ADB_INSTALL_TIMEOUT #https://android.googlesource.com/platform/tools/base/+/bc733f18ec99fe5e14804ec062edc98039d67685/ddmlib/src/main/java/com/android/ddmlib/Device.java#88
      value: "10"
    - name: SEMAPHORE_GIT_DIR
      value: /home/semaphore/git/flowcrypt-android
    - name: ANDROID_HOME
      value: /home/semaphore/Android/Sdk
  prologue:
    commands:
      # use JAVA 21 by default
      - sem-version java 21
      # general settings
      - export PATH=${ANDROID_HOME}/emulator:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}
      - sudo rm -rf ~/.rbenv ~/.phpbrew
      - checkout
      # init environment variables
      - export GRADLE_SUM=$(checksum build.gradle.kts)-$(checksum FlowCrypt/build.gradle.kts)
      - export SDK_SUM=$(checksum ./script/ci-install-android-sdk.sh)
      - export APP_GRADLE_CACHE=project-gradle-cache-$GRADLE_SUM # project .gradle cache, per Gradle config hash
      - if [ "${INSTALL_EMULATOR:-1}" = "0" ]; then export ANDROID_SDK_CACHE=android-sdk-slim-$SDK_SUM; cache restore $ANDROID_SDK_CACHE; else export ANDROID_SDK_CACHE=android-sdk-full-$SDK_SUM; cache restore $ANDROID_SDK_CACHE,android-sdk-d839d0895100d9722fb794bbb9677f92,android-sdk-$SDK_SUM; fi
      # restore app caches
      - cache restore $APP_GRADLE_CACHE
      # restore global caches
      - cache restore gradle-wrapper
      - cache restore gradle-cache-$GRADLE_SUM
      # Install Android dependencies if needed
      - ./script/ci-install-android-sdk.sh
blocks:
  - name: 'Build'
    dependencies: []
    execution_time_limit:
      minutes: 20
    task:
      env_vars:
        - name: INSTALL_EMULATOR
          value: "0"
        - name: INSTALL_KVM_DEPS
          value: "0"
        - name: RUN_KVM_CHECK
          value: "0"
      jobs:
        - name: 'Build Project'
          commands:
            # print debug info
            - cat /proc/cpuinfo
            # print Java version
            - java -version
            # compile project and test artifacts to prime build cache
            - ./gradlew --console=plain --no-daemon --build-cache assembleConsumerUiTests packageConsumerUiTestsAndroidTest packageEnterpriseUiTestsAndroidTest
      epilogue:
        on_pass:
          commands:
            # push workflow artifacts for test jobs
            - ./script/ci-push-build-artifacts.sh

            # store app cache
            - echo "Store the app cache"
            - cache has_key $APP_GRADLE_CACHE || cache store $APP_GRADLE_CACHE .gradle

            # clean and store global cache
            - echo "Store the global cache"
            - find ~/.gradle/caches/ -name "*.lock" -type f -delete # https://medium.com/cirruslabs/mastering-gradle-caching-and-incremental-builds-37eb1af7fcde
            - cache has_key $ANDROID_SDK_CACHE || cache store $ANDROID_SDK_CACHE $ANDROID_HOME
            - cache has_key gradle-wrapper || cache store gradle-wrapper ~/.gradle/wrapper
            - cache has_key gradle-cache-$GRADLE_SUM || cache store gradle-cache-$GRADLE_SUM ~/.gradle/caches

  - name: 'Code Quality & Unit Tests'
    dependencies: []
    task:
      env_vars:
        - name: INSTALL_EMULATOR
          value: "0"
        - name: INSTALL_KVM_DEPS
          value: "0"
        - name: RUN_KVM_CHECK
          value: "0"
      jobs:
        - name: 'Lint(structural quality)'
          execution_time_limit:
            minutes: 15
          commands:
            # run Lint checks
            - ./script/ci-lint-checks.sh

        - name: 'JUnit tests'
          execution_time_limit:
            minutes: 15
          commands:
            # run JUnit tests
            - ./script/ci-junit-tests.sh
      epilogue:
        always:
          commands:
            - ./script/ci-publish-test-results.sh
        on_fail:
          commands:
            - ./script/ci-get-and-publish-debug-info-as-artifact.sh

  - name: 'Instrumentation Tests'
    dependencies: [ "Build" ]
    task:
      env_vars:
        - name: INSTALL_EMULATOR
          value: "1"
      prologue:
        commands:
          - ./script/ci-pull-build-artifacts.sh
      jobs:
        - name: 'Instrumentation tests(No email server)'
          execution_time_limit:
            minutes: 60
          matrix:
            - env_var: EMULATOR
              values: [ "0", "1", "2", "3", "4", "5" ]
          commands:
            # Setup and run an emulator
            - ./script/ci-setup-and-run-emulator.sh
            # wait until ready
            - ./script/ci-wait-for-emulator.sh
            # Run instrumentation tests with live progress and a final summary
            - ./script/ci-stream-instrumentation-test-progress.sh ./script/ci-instrumentation-tests-without-mailserver.sh 6 $EMULATOR

        - name: 'Instrumentation tests(with email server)'
          execution_time_limit:
            minutes: 60
          commands:
            # Run an email server
            - cd docker-mailserver && ./run_email_server.sh && cd -
            # Setup and run an emulator
            - ./script/ci-setup-and-run-emulator.sh
            #wait until ready
            - ./script/ci-wait-for-emulator.sh
            # Run instrumentation tests with live progress and a final summary
            - ./script/ci-stream-instrumentation-test-progress.sh ./script/ci-instrumentation-tests-with-mailserver.sh

        - name: 'Instrumentation tests(enterprise)'
          execution_time_limit:
            minutes: 60
          commands:
            # Setup and run an emulator
            - ./script/ci-setup-and-run-emulator.sh
            #wait until ready
            - ./script/ci-wait-for-emulator.sh
            # Run instrumentation tests with live progress and a final summary
            - ./script/ci-stream-instrumentation-test-progress.sh ./script/ci-instrumentation-tests-enterprise.sh

        - name: 'Instrumentation tests(flaky)'
          execution_time_limit:
            minutes: 60
          commands:
            # Setup and run an emulator
            - ./script/ci-setup-and-run-emulator.sh
            #wait until ready
            - ./script/ci-wait-for-emulator.sh
            # Run instrumentation tests with live progress and a final summary
            - ./script/ci-stream-instrumentation-test-progress.sh ./script/ci-instrumentation-tests-flaky.sh

      epilogue:
        always:
          commands:
            # export tests result if needed
            - ./script/ci-publish-test-results.sh

            # store full android sdk cache if not present
            - cache has_key $ANDROID_SDK_CACHE || cache store $ANDROID_SDK_CACHE $ANDROID_HOME || true

            # do additional actions if needed
            - ./script/ci-after-success-actions-for-instrumentation-tests.sh

        on_fail:
          commands:
            # collect and store debug info as artifacts
            - ./script/ci-get-and-publish-debug-info-as-artifact.sh
            # print debug info
            - ./script/ci-after-fail-debug.sh

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - checkout
          - sudo apt-get install -y jq
          - test-results gen-pipeline-report --generate-mcp-summary
          - artifact pull workflow "test-results/${SEMAPHORE_PIPELINE_ID}.json" -d pipeline-test-results.json
          - ./script/ci-generate-test-report.sh pipeline-test-results.json test-report.md
          - artifact push workflow -f -d .semaphore/REPORT.md test-report.md
          - artifact yank workflow build-cache.tar || true
          - artifact yank workflow apks.tar || true
